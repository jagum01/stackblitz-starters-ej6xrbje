<!DOCTYPE html>
<html lang="es">
  <head>
    <title>Pokédex</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
  </head>
  <body>
    <header class="cabecera">
      <h1>Pokédex</h1>
      <p>Busca un Pokémon por nombre o número</p>
    </header>
    <div id="contenedor">
      <div class="campo">
        <input class="barra" id="input" />
        <button class="button" id="boton">Buscar</button>
      </div>
      <p class="parrafo" id="texto"></p>
      <div class="divresp" id="respuestaApi"></div>
    </div>
    <script src="app.js" defer></script>
    <script src="historial.js" defer></script>
  </body>
</html>
